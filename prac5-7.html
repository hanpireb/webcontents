<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>transition</title>
        <style>
            img {
                width: 200px;
                transition: width 2s;
            }

            img:hover {
                width: 100%;
            }
        </style>
    </head>
    <body>
        <h3>마우스를 올려봐요</h3>
        <hr>
        <img src="media/스폰지밥.jpg">
    </body>
</html>
