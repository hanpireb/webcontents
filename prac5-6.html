<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>animation</title>
        <style>
            #photo {
                width: 200px;
                animation: spin 2s linear infinite;
            }

            @keyframes spin {
                from {
                    transform: rotate(0deg);
                }

                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <h3>어지러워요</h3>
        <hr>
        <img src="media/스폰지밥.jpg" id="photo">   
    </body>
</html>
